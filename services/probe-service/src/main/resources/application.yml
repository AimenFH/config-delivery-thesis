spring:
  application:
    name: probe-service
  cloud:
    config:
      enabled: ${CONFIG_CLIENT_ENABLED:false}
    bus:
      enabled: ${BUS_ENABLED:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq.platform.svc}
    port: 5672
    username: ${RABBITMQ_USER:thesis}
    password: ${RABBITMQ_PASSWORD:thesis}

demo:
  value: "UNSET"
  configVersion: "v0"
  timeoutMs: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: ${BUS_ENABLED:false}

server:
  shutdown: graceful
