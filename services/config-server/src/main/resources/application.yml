server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI:file:///config-repo}
          default-label: main
          clone-on-start: true
    bus:
      enabled: ${BUS_ENABLED:true}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq.platform.svc}
    port: 5672
    username: ${RABBITMQ_USER:thesis}
    password: ${RABBITMQ_PASSWORD:thesis}

management:
  endpoints:
    web:
      exposure:
        include: health,busrefresh
