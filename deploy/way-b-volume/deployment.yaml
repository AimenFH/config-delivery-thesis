apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-service
  namespace: thesis
  annotations:
    spring.cloud.kubernetes.configmap.reload: "true"
spec:
  replicas: 3
  selector:
    matchLabels: {app: probe-service}
  template:
    metadata:
      labels: {app: probe-service}
    spec:
      containers:
        - name: probe
          image: probe-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "configtree:/etc/config/"
          volumeMounts:
            - name: config
              mountPath: /etc/config
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: "250m", memory: "384Mi"}
            limits:   {cpu: "500m", memory: "512Mi"}
      volumes:
        - name: config
          configMap: {name: demo-config}
