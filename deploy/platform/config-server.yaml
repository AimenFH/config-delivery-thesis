apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: config-server}
  template:
    metadata:
      labels: {app: config-server}
    spec:
      containers:
        - name: config-server
          image: config-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8888}]
          env:
            - name: CONFIG_REPO_URI
              value: https://github.com/AimenFH/config-delivery-config.git
            - name: RABBITMQ_HOST
              value: rabbitmq
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8888}
            periodSeconds: 5
          resources:
            requests: {cpu: "250m", memory: "384Mi"}
            limits:   {cpu: "1", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: platform
spec:
  selector: {app: config-server}
  ports: [{port: 8888, targetPort: 8888}]
