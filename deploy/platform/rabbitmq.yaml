apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13
          ports: [{containerPort: 5672}]
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: thesis
            - name: RABBITMQ_DEFAULT_PASS
              value: thesis
          readinessProbe:
            tcpSocket: {port: 5672}
            periodSeconds: 5
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits:   {cpu: "1", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: platform
spec:
  selector: {app: rabbitmq}
  ports: [{port: 5672, targetPort: 5672}]
